  <style>
    :root {
      color-scheme: light;
      --paper: #f7f3eb;
      --paper-deep: #efe6d7;
      --surface: #fffdf8;
      --surface-soft: #f1f6f1;
      --ink: #172426;
      --muted: #647175;
      --line: #d7ded7;
      --teal: #176c69;
      --teal-soft: #dcefeb;
      --gold: #e7c465;
      --sage: #9dcc77;
      --aqua: #7fc5be;
      --plum: #d09abe;
      --coral: #c95d43;
      --blue: #486aa8;
      --shadow: 0 12px 40px rgba(36, 45, 38, 0.12);
      --radius: 8px;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Avenir Next", sans-serif;
      font-feature-settings: "palt";
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(23, 108, 105, 0.05) 1px, transparent 1px),
        linear-gradient(180deg, rgba(201, 93, 67, 0.05) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      letter-spacing: 0;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -1px -14px 12px;
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      background: color-mix(in srgb, var(--paper) 88%, white);
      border-bottom: 1px solid rgba(23, 108, 105, 0.16);
      backdrop-filter: blur(18px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .brand-mark {
      display: inline-grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: white;
      background: var(--teal);
      border-radius: 50%;
      font: 700 13px/1 "Avenir Next", "Hiragino Sans", sans-serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 38px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .brand small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .poster-link {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 9px 11px;
      color: var(--teal);
      border: 1px solid rgba(23, 108, 105, 0.28);
      border-radius: var(--radius);
      background: #fffaf0;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .summary {
      display: grid;
      gap: 12px;
      margin: 0 0 14px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #ded7ca;
      border-left: 6px solid var(--teal);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .summary-kicker {
      margin: 0 0 5px;
      color: #8a6c38;
      font-size: 12px;
      font-weight: 800;
    }

    .summary-title {
      margin: 0;
      font-size: clamp(22px, 6.2vw, 32px);
      line-height: 1.16;
    }

    .summary-passage {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.42;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 10px 9px;
      border: 1px solid #e1dccf;
      border-radius: var(--radius);
      background: #fbf7ef;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 18px;
      line-height: 1;
      white-space: nowrap;
    }

    .progress-track {
      overflow: hidden;
      height: 12px;
      background: #e5ebe5;
      border-radius: 999px;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--gold));
      border-radius: inherit;
      transition: width 220ms ease;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 42px;
      gap: 8px;
    }

    .action-button {
      min-height: 42px;
      padding: 10px 9px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid #d7ded7;
      border-radius: var(--radius);
      font: 800 14px/1 "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .action-button.primary {
      color: white;
      background: var(--teal);
      border-color: var(--teal);
    }

    .timeline {
      display: grid;
      gap: 10px;
      padding-bottom: 36px;
    }

    .reading-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 10px;
      padding: 12px 11px 12px 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 6px 18px rgba(38, 50, 43, 0.06);
    }

    .reading-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: transparent;
      content: "";
    }

    .reading-card.weekend-sat::before {
      background: var(--blue);
    }

    .reading-card.weekend-sun::before {
      background: var(--coral);
    }

    .reading-card.is-complete {
      background: #edf8f2;
      border-color: #90cdb6;
    }

    .reading-card.is-calendar-today {
      outline: 2px solid rgba(23, 108, 105, 0.45);
      outline-offset: 2px;
    }

    .day-box {
      min-width: 0;
      padding-top: 3px;
      text-align: center;
    }

    .day-number {
      display: block;
      font: 800 26px/1 "Avenir Next", "Hiragino Sans", sans-serif;
    }

    .date-short {
      display: block;
      margin-top: 7px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .weekday {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .card-body {
      min-width: 0;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      margin-bottom: 7px;
    }

    .pill {
      display: inline-flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .status-pill {
      color: #405052;
      background: #dce2de;
    }

    .reading-card.is-complete .status-pill {
      color: white;
      background: var(--teal);
    }

    .section-s1 {
      background: var(--gold);
    }

    .section-s2 {
      background: var(--sage);
    }

    .section-follow {
      background: var(--aqua);
    }

    .section-grow {
      background: var(--plum);
    }

    .reading-title {
      margin: 0;
      font-size: 17px;
      line-height: 1.36;
      letter-spacing: 0;
    }

    .passage {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 8px 0 0;
      color: #39484b;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.42;
    }

    .passage span {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .toggle-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .toggle-button {
      min-height: 40px;
      min-width: 128px;
      padding: 10px 12px;
      color: var(--teal);
      background: #fffaf0;
      border: 1px solid rgba(23, 108, 105, 0.24);
      border-radius: var(--radius);
      font: 900 14px/1 "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .reading-card.is-complete .toggle-button {
      color: white;
      background: var(--teal);
      border-color: var(--teal);
    }

    .poster-panel {
      margin: 2px 0 12px;
      padding: 11px;
      background: #fffaf0;
      border: 1px solid #e2d7c2;
      border-radius: var(--radius);
    }

    .poster-panel img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: cover;
      object-position: top;
      border: 1px solid #d8d1c5;
      border-radius: var(--radius);
    }

    .poster-panel a {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      margin-top: 9px;
      padding: 9px 11px;
      color: white;
      background: #8a6c38;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
    }

    @media (min-width: 680px) {
      .app-shell {
        padding-inline: 22px;
      }

      .topbar {
        margin-inline: -22px;
        padding-inline: 22px;
      }

      .timeline {
        grid-template-columns: 1fr 1fr;
      }

      .reading-card {
        min-height: 156px;
      }
    }
  </style>
</head>

      { day: 49, date: "2026-06-13", weekday: "土", section: "成熟", title: "弟子は神を愛し人を愛する", passage: "マタイ 22:34-40" },
      { day: 50, date: "2026-06-14", weekday: "日", section: "成熟", title: "弟子はあらゆる国の人を弟子とする", passage: "マタイ 28:16-20" },
      { day: 51, date: "2026-06-15", weekday: "月", section: "成熟", title: "弟子は弟子の道のコストを数える", passage: "ルカ 14:25-35" },
      { day: 52, date: "2026-06-16", weekday: "火", section: "成熟", title: "弟子は失われた者を探し求める", passage: "ルカ 15章" },
      { day: 53, date: "2026-06-17", weekday: "水", section: "成熟", title: "弟子は永遠のために投資する", passage: "ルカ 16:1-9" },
      { day: 54, date: "2026-06-18", weekday: "木", section: "成熟", title: "弟子はキリストの大使である", passage: "2コリント 5:11-21" },
      { day: 55, date: "2026-06-19", weekday: "金", section: "成熟", title: "弟子は自分のストーリーを分かち合う", passage: "ヨハネ 4:4-26、39-42" },
      { day: 56, date: "2026-06-20", weekday: "土", section: "成熟", title: "イエスの弟子は信じ、バプテスマを受ける", passage: "使徒 8:9-13" },
      { day: 57, date: "2026-06-21", weekday: "日", section: "成熟", title: "弟子は聖餐においてイエスを記念する", passage: "ルカ 22:14-23" },
      { day: 58, date: "2026-06-22", weekday: "月", section: "成熟", title: "弟子はキリストのからだの一部であることを理解する", passage: "1コリント 12:12-30" },
      { day: 59, date: "2026-06-23", weekday: "火", section: "成熟", title: "弟子はコミュニティを実践する", passage: "ヘブル 10:23-25" },
      { day: 60, date: "2026-06-24", weekday: "水", section: "成熟", title: "弟子は父なる神の役割を理解する", passage: "詩篇 139:1-8" },
      { day: 61, date: "2026-06-25", weekday: "木", section: "成熟", title: "弟子は聖霊の役割を理解する", passage: "1コリント 2:10-16" },
      { day: 62, date: "2026-06-26", weekday: "金", section: "成熟", title: "弟子は御子の役割を理解する", passage: "コロサイ 1:15-20" },
      { day: 63, date: "2026-06-27", weekday: "土", section: "成熟", title: "弟子は神との関係に基づいて祈る", passage: "ヨハネ 17章" },
      { day: 64, date: "2026-06-28", weekday: "日", section: "成熟", title: "弟子はキリストにおける自分の立場に照らして生きる", passage: "エペソ 1:3-14" },
      { day: 65, date: "2026-06-29", weekday: "月", section: "成熟", title: "弟子はキリストとの関係において安全である", passage: "ヨハネ 10:25-30" },
      { day: 66, date: "2026-06-30", weekday: "火", section: "成熟", title: "弟子は神の訓練を受け入れる", passage: "ヘブル 12:5-11" },
      { day: 67, date: "2026-07-01", weekday: "水", section: "成熟", title: "弟子は神を愛し隣人を愛する", passage: "マルコ 12:28-34" },
      { day: 68, date: "2026-07-02", weekday: "木", section: "成熟", title: "弟子はキリストにあって一致を保つ", passage: "エペソ 4:1-6" },
      { day: 69, date: "2026-07-03", weekday: "金", section: "成熟", title: "弟子はキリストにあって一致を保つ", passage: "1コリント 1:10-17" },
      { day: 70, date: "2026-07-04", weekday: "土", section: "成熟", title: "弟子は生きる知恵をもたらす神の御言葉を喜ぶ", passage: "詩篇 1篇" }
    ];

    const timeline = document.querySelector("#timeline");
    const summaryKicker = document.querySelector("#summary-kicker");
    const summaryTitle = document.querySelector("#summary-title");
    const summaryPassage = document.querySelector("#summary-passage");
    const completedCount = document.querySelector("#completed-count");
    const remainingCount = document.querySelector("#remaining-count");
    const progressFill = document.querySelector("#progress-fill");
    const nextButton = document.querySelector("#next-button");
    const todayButton = document.querySelector("#today-button");
    const resetButton = document.querySelector("#reset-button");

    function localTodayIso() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function loadCompleted() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_COMPLETED));
        return new Set(DEFAULT_COMPLETED);
      }
      try {
        const values = JSON.parse(raw).filter((value) => Number.isInteger(value));
        return new Set(values);
      } catch {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_COMPLETED));
        return new Set(DEFAULT_COMPLETED);
      }
    }

    function saveCompleted(completed) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed].sort((a, b) => a - b)));
    }

    let completed = loadCompleted();
    const todayIso = localTodayIso();

    function sectionClass(section) {
      return SECTION_CLASS[section] || "section-grow";
    }

    function shortDate(date) {
      const [, month, day] = date.split("-");
      return `${Number(month)}/${Number(day)}`;
    }

    function renderCards() {
      timeline.innerHTML = READINGS.map((reading) => {
        const isComplete = completed.has(reading.day);
        const isToday = reading.date === todayIso;
        const weekendClass = reading.weekday === "土" ? "weekend-sat" : reading.weekday === "日" ? "weekend-sun" : "";
        return `
          <article class="reading-card ${weekendClass} ${isComplete ? "is-complete" : ""} ${isToday ? "is-calendar-today" : ""}" id="day-${reading.day}" data-day="${reading.day}">
            <div class="day-box">
              <span class="day-number">${String(reading.day).padStart(2, "0")}</span>
              <time class="date-short" datetime="${reading.date}">${shortDate(reading.date)}</time>
              <span class="weekday">(${reading.weekday})</span>
            </div>
            <div class="card-body">
              <div class="meta-row">
                <span class="pill status-pill">${isComplete ? "完了" : "予定"}</span>
                <span class="pill ${sectionClass(reading.section)}">${reading.section}</span>
              </div>
              <h2 class="reading-title">${reading.title}</h2>
              <p class="passage"><span>聖書箇所</span>${reading.passage}</p>
            </div>
            <div class="toggle-row">
              <button class="toggle-button" type="button" aria-pressed="${isComplete}" data-toggle="${reading.day}">
                ${isComplete ? "完了済み" : "完了にする"}
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function updateSummary() {
      const done = completed.size;
      const remaining = READINGS.length - done;
      const nextReading = READINGS.find((reading) => !completed.has(reading.day)) || READINGS[READINGS.length - 1];
      const calendarReading = READINGS.find((reading) => reading.date === todayIso);
      const featured = calendarReading && !completed.has(calendarReading.day) ? calendarReading : nextReading;

      summaryKicker.textContent = completed.has(featured.day) ? "完了" : featured.date === todayIso ? "今日の箇所" : "次に読む箇所";
      summaryTitle.textContent = featured.title;
      summaryPassage.textContent = `${shortDate(featured.date)}（${featured.weekday}） ${featured.passage}`;
      completedCount.textContent = `${done} / ${READINGS.length}`;
      remainingCount.textContent = `${remaining}日`;
      progressFill.style.width = `${Math.round((done / READINGS.length) * 100)}%`;
      nextButton.dataset.target = `day-${nextReading.day}`;
      todayButton.dataset.target = calendarReading ? `day-${calendarReading.day}` : `day-${nextReading.day}`;
    }

    function scrollToCard(id) {
      const target = document.getElementById(id);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function refresh() {
      renderCards();
      updateSummary();
    }

    timeline.addEventListener("click", (event) => {
      const button = event.target.closest("[data-toggle]");
      if (!button) return;
      const day = Number(button.dataset.toggle);
      if (completed.has(day)) {
        completed.delete(day);
      } else {
        completed.add(day);
      }
      saveCompleted(completed);
      refresh();
    });

    nextButton.addEventListener("click", () => scrollToCard(nextButton.dataset.target));
    todayButton.addEventListener("click", () => scrollToCard(todayButton.dataset.target));
    resetButton.addEventListener("click", () => {
      completed = new Set(DEFAULT_COMPLETED);
      saveCompleted(completed);
      refresh();
      scrollToCard("day-4");
    });

    refresh();
  </script>
</body>
</html>
